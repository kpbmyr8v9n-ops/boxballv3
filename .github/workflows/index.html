// ---- layout

function rs(){dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;s=Math.min(innerWidth/360,innerHeight/600);vw=innerWidth/s;vh=innerHeight/s;ox=(vw-360)/2;cs=Math.min(48,Math.floor((vh-182)/9));gx0=(360-7*cs)/2;ax0=gx0;ax1=gx0+7*cs;dy0=gy0+9*cs;Fy=dy0+26}
addEventListener('resize',rs);rs();

const MB=[...Array(14)].map((_,i)=>({x:rnd()*360,y:rnd()*700,v:10+rnd()*20,n:1+(rnd()*60|0),r:rnd()*6})),MBA=[...Array(4)].map(()=>({x:rnd()*300+30,y:rnd()*500,vx:150+rnd()*60,vy:170}));
const scr=h=>{const u=$('#ui');if(h==null){u.classList.remove('on');return}u.className='scr on '+(mode=='menu'?'m':'');u.innerHTML=h;u.scrollTop=0},bk=(f,l='Back')=>`<button class="b p" onclick="sfx.click();${f}">${l}</button>`;
function menu(){mode='menu';G=null;dmCheck();achCheck();const mc=S.dm.m.filter(m=>m.p>=m.g&&!m.cl).length,ac=ACH.filter(a=>S.ac[a[0]]==1).length;scr(`<h1 class="t">NEON<br>SHATTER</h1><div class="sub">AIM · BOUNCE · BREAK</div><span class="pill">🪙 ${S.coins} &nbsp;·&nbsp; BEST ${S.best}</span><button class="b l" onclick="au();lvSel()" style="animation-delay:.05s">▶ Level mode · ${Math.min(S.ul,100)}</button><button class="b" onclick="au();endless()" style="animation-delay:.1s">∞ Endless${S.run?' ●':''}</button><div style="display:flex;gap:10px;width:100%;max-width:290px"><button class="b p sm" style="flex:1;min-width:0" onclick="au();missions()">🎯 Missions${mc?' ●':''}</button><button class="b p sm" style="flex:1;min-width:0" onclick="au();achs()">🏆 Awards${ac?' ●':''}</button></div><button class="b p" onclick="au();shop()" style="animation-delay:.2s">Ball skins</button><button class="b" onclick="au();sett()" style="animation-delay:.25s">Settings</button>`)}

function shop(){scr(`<h1 class="t s">BALL SKINS</h1><span class="pill">🪙 ${S.coins}</span><div class="sg">${SK.map((k,i)=>{const o=S.own.includes(i),on=S.skin==i,c=k[2]<0?'#f0f':`hsl(${k[2]},100%,60%)`;return `<div class="card sk ${on?'on':''}"><div class="orb ${k[2]==-1?'rb':''}" style="--c:${c}"></div><b>${k[0]}</b>${on?'<small>Equipped</small>':o?`<button class="b sm l" onclick="eq(${i})">Equip</button>`:`<button class="b sm" onclick="buy(${i})">🪙 ${k[1]}</button>`}</div>`}).join('')}</div><button class="b sm l" onclick="Ads.rewarded(()=>{gain(50,0);save();shop()})">📺 Optional: +50 🪙</button>${bk('menu()')}`)}
const eq=i=>{S.skin=i;sfx.click();save();shop()},buy=i=>{if(S.coins<SK[i][1]){sfx.over();return}S.coins-=SK[i][1];S.own.push(i);S.skin=i;sfx.up();save();shop()};
function sett(){const t=(k,l)=>`<button class="b ${S[k]?'l':'p'}" onclick="S.${k}^=1;save();sett()">${l}: ${S[k]?'ON':'OFF'}</button>`;scr(`<h1 class="t s">SETTINGS</h1>${t('mus','🎵 Music')}${t('snd','🔊 Sounds')}${t('vib','📳 Vibration')}<button class="b" onclick="try{document.documentElement.requestFullscreen()}catch(e){}">⛶ Fullscreen</button><button class="b p" onclick="if(confirm('Erase ALL progress?')){S=SD();save();menu()}">🗑 Reset progress</button>${bk('menu()')}`)}

// ---- game
const hp0=(b,r)=>Math.max(1,Math.round(b*(.7+rnd()*.7)));
function play(resume,ln){const g=Array.from({length:11},()=>Array(7).fill(null));G={g,round:1,lv:1,balls:1,score:0,lx:180,combo:0,pw:{x:0,l:0,b:0,f:0,d:0,c:0},arm:{},vol:{b:0,d:1,c:1},B:[],q:0,t:0,freeze:0,ban:null,destroyed:0};
 if(resume&&S.run){const r=S.run;Object.assign(G,{round:r.round,lv:r.lv,balls:r.balls,score:r.score,lx:r.lx,pw:r.pw,freeze:r.fr||0});r.cells.forEach(a=>g[a[0]][a[1]]={t:a[2],hp:a[3],mx:a[4],sh:a[5],k:a[6],p:a[7],oy:0,pop:1,fl:0})}else if(ln)lvlBuild(ln);else{spawn(2,1);spawn(1,1);spawn(0,1)}
 mode='play';st='aim';FX=[];aim.on=0;scr()}
function mkBlock(base,lv,q,rf=rnd){let t=0,hp=Math.max(1,Math.round(base*(.7+rf()*.7)));if(lv>=2&&q<.09)t=1;else if(lv>=3&&q<.18)t=3;else if(lv>=4&&q<.28)t=2;else if(lv>=5&&q<.34)t=5;else if(lv>=3&&q<.45)t=4;if(t==4)hp*=2;if(t==1)hp=Math.max(1,Math.ceil(hp*.7));return{t,hp,mx:hp,sh:t==3?3:0,oy:-cs,pop:1,fl:0}}
function spawn(r,base){const g=G.g,lv=G.lv,cells=[0,1,2,3,4,5,6].sort(()=>rnd()-.5),nb=2+(rnd()*(2+Math.min(lv,2))|0);
 for(let k=0;k<nb;k++)g[r][cells[k]]=mkBlock(base,lv,rnd());
 g[r][cells[nb]]={t:9,k:'b',oy:-cs,pop:1};if(rnd()<.4)g[r][cells[nb+1]]={t:9,k:'c',oy:-cs,pop:1};if(rnd()<.17)g[r][cells[nb+2]]={t:9,k:'p',p:'xlbfdc'[rnd()*6|0],oy:-cs,pop:1}}
function saveRun(){if(!G||G.over||G.lm)return;const cells=[];G.g.forEach((row,r)=>row.forEach((o,c)=>o&&cells.push([r,c,o.t,o.hp||0,o.mx||0,o.sh||0,o.k,o.p])));S.run={round:G.round,lv:G.lv,balls:G.balls,score:G.score,lx:G.lx,pw:G.pw,fr:G.freeze,cells};save()}
function txt(x,y,s,c='#fff'){FX.push({x,y,vy:-40,t:.9,m:.9,s,c})}
function burst(x,y,h,n,sp=140){for(let i=0;i<n&&FX.length<320;i++){const a=rnd()*6.28,v=rnd()*sp;FX.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,t:.5+rnd()*.4,m:.9,c:`hsl(${h},100%,65%)`,r:1.5+rnd()*2.5,g:380})}}
const hue=hp=>hp<5?190:hp<10?150:hp<20?58:hp<35?28:hp<60?330:275;
function dmg(o,r,c,n){if(o.t==5)return;if(o.sh>0){o.sh--;o.fl=.12;sfx.shield();return}o.hp-=n;o.fl=.12;o.pop=1.15;G.score+=n;const x=gx0+c*cs+cs/2,y=gy0+r*cs+cs/2;if(o.hp<=0)kill(o,r,c,x,y);else{sfx.hit(G.combo);burst(x,y,hue(o.hp),3,90)}}
function kill(o,r,c,x,y){G.g[r][c]=null;G.destroyed++;G.combo++;G.score+=50;sfx.brk(G.combo);vib(8);sh=Math.max(sh,Math.min(9,2+o.mx/8));burst(x,y,hue(o.mx),16,200);FX.push({x,y,ring:1,t:.3,m:.3,c:`hsl(${hue(o.mx)},100%,70%)`});
 S.st.blocks++;trk('blocks',1);if(rnd()<.1){const n=G.vol.c;gain(n,1);txt(x,y,'+'+n+' 🪙','#ffd23f');sfx.coin()}
 if(o.t==1)boom(r,c,6+G.lv*2);if(o.t==2)[-1,1].forEach(d=>{if(c+d>=0&&c+d<7&&!G.g[r][c+d]){const h=Math.max(1,Math.ceil(o.mx/3));G.g[r][c+d]={t:0,hp:h,mx:h,sh:0,oy:0,pop:1.4,fl:0}}})}
function boom(r,c,d){const x=gx0+c*cs+cs/2,y=gy0+r*cs+cs/2;sfx.bomb();sh=Math.max(sh,12);vib(30);FX.push({x,y,ring:2,t:.45,m:.45,c:'#ff9a3d'});burst(x,y,30,24,260);for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const rr=r+a,cc=c+b;if(rr<0||rr>9||cc<0||cc>6||(!a&&!b))continue;const o=G.g[rr][cc];if(o&&o.t!=9&&o.t!=5){o.sh=0;dmg(o,rr,cc,d)}}}
function take(o,r,c,x,y){G.g[r][c]=null;sfx.pick();burst(x,y,50,10,120);if(o.k=='b'){G.balls++;txt(x,y,'+1 BALL','#35f2ff')}else if(o.k=='c'){const n=G.vol.c;gain(n,1);sfx.coin();txt(x,y,'+'+n+' 🪙','#ffd23f')}else{G.pw[o.p]++;txt(x,y,PW.find(p=>p[0]==o.p)[2]+'!','#b6ff3d')}}
function usePw(k){if(st!='aim'||!G.pw[k])return;G.pw[k]--;sfx.pick();if(k=='x')G.balls+=3;else if(k=='l'){let m=-1;G.g.forEach((row,r)=>row.forEach(o=>{if(o&&o.t!=9&&o.t!=5)m=r}));if(m<0){G.pw.l++;return}sfx.laser();sh=8;G.beam={y:gy0+m*cs+cs/2,t:.35};for(let c=0;c<7;c++){const o=G.g[m][c];if(o&&o.t!=9&&o.t!=5){o.sh=0;dmg(o,m,c,6)}}}else if(k=='f')G.freeze=1;else G.arm[k]=1}
function fire(dx,dy){trk('balls',G.balls);G.turbo=0;G.q=G.balls;G.dx=dx;G.dy=dy;G.qt=0;G.t=0;G.first=null;G.B=[];G.destroyed=0;G.combo=0;G.vol={b:G.arm.b?1:0,d:G.arm.d?2:1,c:G.arm.c?3:1};G.arm={};st='fire'}

function achCheck(){for(const a of ACH)if(!S.ac[a[0]]&&a[3]()>=a[4]){S.ac[a[0]]=1;if(G&&mode=='play')txt(180,130,'🏆 '+a[1],'#ffd23f')}}
function missions(){dmCheck();const h=Math.ceil((new Date().setHours(24,0,0,0)-Date.now())/36e5);scr(`<h1 class="t s">DAILY MISSIONS</h1><span class="pill">Resets in ~${h}h</span>${S.dm.m.map((m,i)=>{const dn=m.p>=m.g;return `<div class="card ${dn&&!m.cl?'on':''}"><span style="font-size:30px">${m.i}</span><div style="flex:1"><b>${m.t} ${m.g}</b><div class="bar"><i style="width:${Math.min(100,m.p/m.g*100)}%"></i></div><small>${Math.min(m.p,m.g)} / ${m.g} · 🪙 ${m.r}</small></div>${m.cl?'<b>✓</b>':dn?`<button class="b sm l" onclick="clm(${i})">Claim</button>`:''}</div>`}).join('')}${bk('menu()')}`)}
function clm(i){const m=S.dm.m[i];if(m.cl||m.p<m.g)return;m.cl=1;gain(m.r,0);sfx.up();save();missions()}
function achs(){achCheck();scr(`<h1 class="t s">ACHIEVEMENTS</h1><span class="pill">${ACH.filter(a=>S.ac[a[0]]==2).length}/${ACH.length} completed</span>${ACH.map(a=>{const v=Math.min(a[3](),a[4]),k=S.ac[a[0]]|0;return `<div class="card ${k==1?'on':k==0?'off':''}"><span style="font-size:28px">${k==2?'🏆':k==1?'🎁':'🔒'}</span><div style="flex:1"><b>${a[1]}</b><small>${a[2]}</small><div class="bar"><i style="width:${v/a[4]*100}%"></i></div><small>${v} / ${a[4]} · 🪙 ${a[5]}</small></div>${k==1?`<button class="b sm l" onclick="clmA('${a[0]}')">Claim</button>`:k==2?'<b>✓</b>':''}</div>`}).join('')}${bk('menu()')}`)}
function clmA(id){const a=ACH.find(x=>x[0]==id);if(S.ac[id]!=1)return;S.ac[id]=2;gain(a[5],0);sfx.up();save();achs()}
// level mode
function lvDef(n){return{tier:Math.min(6,1+(n/12|0)),h:Math.min(5,3+(n/25|0)),pat:(n*5+(n/8|0))%8,base:1+n*.19,w:n<8?0:Math.min(6,n/12|0),B:Math.min(45,Math.round(2+n*.45))}}
function msk(p,r,c,h,f){switch(p){case 0:return f()>.3;case 1:return(r+c)%2==0;case 2:return Math.abs(c-3)<=r;case 3:return Math.abs(c-3)+Math.abs(r-(h-1)/2)<=3;case 4:return c%2==0||r==0;case 5:return r==0||r==h-1||c==0||c==6;case 6:return(c+(r%2)*3)%4<2;default:return r%2==0}}
function lvlBuild(n){const d=lvDef(n),f=mk(n*104729+7);Object.assign(G,{lm:1,ln:n,lv:d.tier,balls:d.B,waves:d.w,base:d.base,turns:0,grace:1,near:0,won:0});let hp=0,cnt=0;
 for(let r=0;r<d.h;r++)for(let c=0;c<7;c++)if(msk(d.pat,r,c,d.h,f)){const o=mkBlock(d.base,d.tier,f(),f);G.g[r][c]=o;cnt++;if(o.t!=5)hp+=o.hp}
 if(cnt<8)for(let c=0;c<7;c++)if(!G.g[0][c]){G.g[0][c]=mkBlock(d.base,d.tier,.99,f);hp+=G.g[0][c].hp}
 const e=[];for(let r=0;r<=d.h;r++)for(let c=0;c<7;c++)if(!G.g[r][c])e.push([r,c]);let q=e.splice(f()*e.length|0,1)[0];G.g[q[0]][q[1]]={t:9,k:'b',oy:-cs,pop:1};if(n>=3&&e.length>2){q=e.splice(f()*e.length|0,1)[0];G.g[q[0]][q[1]]={t:9,k:'c',oy:-cs,pop:1}}
 G.tot=left();G.par=Math.max(2,Math.ceil(hp/(d.B*2.4)))+d.w;G.ban={t:2.4,s:'LEVEL '+n,s2:PN[d.pat]}}
function descend(sp){for(let r=10;r>0;r--)G.g[r]=G.g[r-1];G.g[0]=Array(7).fill(null);G.g.forEach(row=>row.forEach(o=>o&&(o.oy=-cs)));if(sp)spawn(0,sp);for(let r=9;r<11;r++)for(let c=0;c<7;c++){const o=G.g[r][c];if(o&&o.t!=9&&o.t!=5&&r==9)G.over=1;if(o&&(o.t==9||o.t==5||r==10))G.g[r][c]=null}for(let r=7;r<9;r++)G.g[r].forEach(o=>o&&o.t!=9&&o.t!=5&&(G.near=1))}
function lmEnd(){G.turns++;save();if(left()==0&&G.waves<=0){G.won=1;st='desc';G.dt=1.2;return}
 if(G.freeze){G.freeze=0;txt(180,gy0+60,'FROZEN – blocks hold!','#8ef')}else if(G.grace)G.grace=0;else{const w=G.waves>0;if(w)G.waves--;descend(w?G.base+G.turns*.2:0)}st='desc';G.dt=.55}
function win(){mode='ui';const n=G.ln,L=S.lm[n]||{st:0,sc:0,pf:0},t=G.turns,p=G.par,sr=t<=p?3:t<=Math.ceil(p*1.6)+1?2:1,pf=sr==3&&!G.near,first=!L.st;
 let co=10+(n/2|0)+sr*5;if(!first)co=Math.ceil(co*.3)+(sr>L.st?5*(sr-L.st):0);const pb=pf&&!L.pf?20:0,ms=first&&n%10==0?50*(n/10):0,SKM={25:4,50:6,100:7};let sk='';
 if(first&&SKM[n]!==undefined&&!S.own.includes(SKM[n])){S.own.push(SKM[n]);sk=SK[SKM[n]][0]}
 gain(co+pb+ms,0);G.score+=sr*200;S.lm[n]={st:Math.max(L.st,sr),sc:Math.max(L.sc,G.score),pf:L.pf||pf};if(pf&&!L.pf)S.st.perf++;S.ul=Math.max(S.ul,Math.min(100,n+1));S.best=Math.max(S.best,G.score);trk('levels',1);trk('score',G.score);achCheck();save();sfx.up();vib(40);
 scr(`<h1 class="t s">${pf?'PERFECT!':'LEVEL COMPLETE'}</h1><div class="sub">LEVEL ${n}</div><div class="stars">${[1,2,3].map(k=>`<i class="${k<=sr?'on':''}" style="animation-delay:${k*.25}s">★</i>`).join('')}</div><div class="big">${G.score}</div><div class="card" style="flex-direction:column;text-align:center"><b>🪙 +${co} coins</b>${pb?'<small>✨ Perfect run bonus +'+pb+'</small>':''}${ms?'<small>🎁 Milestone reward +'+ms+'</small>':''}${sk?'<small>🎱 New ball skin unlocked: '+sk+'!</small>':''}<small>${t} turns · par ${p}</small></div>${n<100?`<button class="b l" onclick="play(0,${n+1})">Next level ▶</button>`:'<div class="sub">YOU CLEARED ALL 100 LEVELS!</div>'}<button class="b" onclick="play(0,${n})">↻ Replay</button><button class="b p" onclick="lvSel()">Level select</button>`)}
function lose(){mode='ui';sfx.over();vib(80);S.best=Math.max(S.best,G.score);save();scr(`<h1 class="t s">LEVEL FAILED</h1><div class="sub">LEVEL ${G.ln} · ${left()} BLOCKS LEFT</div><div class="big">${G.score}</div><span class="pill">🔒 Your progress is safe</span><button class="b l" onclick="play(0,${G.ln})">↻ Retry level ${G.ln}</button><button class="b" onclick="Ads.rewarded(revive)">📺 Revive (optional)</button><button class="b p" onclick="lvSel()">Level select</button>`)}
function lvSel(){mode='menu';G=null;scr(`<h1 class="t s">LEVEL MODE</h1><span class="pill">★ ${stars()}/300 · ${doneL()}/100 cleared</span><div class="lg">${[...Array(100)].map((_,i)=>{const n=i+1,ok=n<=S.ul,L=S.lm[n],cur=ok&&!(L&&L.st);return `<button class="lv ${!ok?'k':L&&L.st?'d':cur?'c':''} ${n%10==0?'m':''}" ${ok?`onclick="sfx.click();lvBrief(${n})"`:'disabled'}>${ok?`<b>${n}</b><small>${L&&L.st?'★'.repeat(L.st)+'☆'.repeat(3-L.st):n%10==0?'🎁':'·'}</small>`:'🔒'}</button>`}).join('')}</div>${bk('menu()')}`);const e=$('.lv.c');e&&e.scrollIntoView({block:'center'})}
function lvBrief(n){const d=lvDef(n),L=S.lm[n]||{st:0,sc:0};scr(`<h1 class="t s">LEVEL ${n}</h1><div class="sub">${PN[d.pat].toUpperCase()}</div><div class="card" style="flex-direction:column;text-align:center"><b>🎯 Objective</b><small>Destroy every block before it crosses the red line.${d.w?` ${d.w} extra wave${d.w>1?'s':''} will drop in.`:''}</small><small>${d.B} balls · ${LV[d.tier-1][0]}</small></div><div class="stars">${[1,2,3].map(k=>`<i class="${k<=L.st?'on':''}">★</i>`).join('')}</div><span class="pill">${L.st?'Best score '+L.sc:'Not cleared yet'}${n%10==0?' · 🎁 Milestone':''}</span><button class="b l" onclick="au();play(0,${n})">▶ Start</button>${bk('lvSel()')}`)}
// combo
function comboEnd(){const n=G.destroyed;trk('score',G.score);if(n>=2){const lv=Math.min(5,n-1),bs=n*25,co=Math.max(0,n-3);G.score+=bs;if(co)gain(co,0);G.cmb={s:['GREAT!','AMAZING!','AWESOME!','INCREDIBLE!','LEGENDARY!'][lv-1],s2:'+'+bs+(co?' · +'+co+' 🪙':''),lv,t:2,m:2};sfx.combo(lv);vib(10+lv*8);sh=Math.max(sh,lv*2);for(let i=0;i<lv;i++)burst(60+i*60+rnd()*20,vh*.3,[190,150,50,28,330][i],10+lv*4,160+lv*30);if(lv==5){S.st.legend++;FX.push({x:180,y:vh*.3,ring:3,t:.6,m:.6,c:'#fff'})}}achCheck()}
function cmbDraw(){if(G.turbo&&st=='fire'){cx.fillStyle='#fff';cx.font='700 12px Orbitron';cx.textAlign='center';cx.fillText('⏩ TURBO',180,vh*.5)}const c=G.cmb;if(!c||c.t<=0)return;const a=c.m-c.t,p=Math.min(1,a/.3),z=a<.3?.4+p+.35*Math.sin(p*3.14):1+Math.sin(a*5)*.03,h=c.lv>=5?T*400%360:[190,150,50,28,330][c.lv-1],col=`hsl(${h},100%,62%)`;cx.save();cx.translate(180,vh*.3);cx.scale(z,z);cx.rotate(Math.sin(a*8)*.02*(6-c.lv));cx.globalAlpha=Math.min(1,c.t/.5);cx.textAlign='center';cx.textBaseline='middle';cx.shadowColor=col;cx.shadowBlur=16+c.lv*8;cx.lineJoin='round';cx.lineWidth=5+c.lv;cx.strokeStyle=col;cx.fillStyle='#fff';cx.font=`900 ${22+c.lv*3}px Orbitron,sans-serif`;cx.strokeText(c.s,0,0,330);cx.fillText(c.s,0,0,330);cx.shadowBlur=0;cx.font='700 16px Rajdhani';cx.fillStyle=col;cx.fillText(c.s2,0,28+c.lv*2);cx.restore()}
addEventListener('pagehide',save);addEventListener('visibilitychange',()=>{if(document.hidden)save()});
let la=performance.now();function loop(n){const dt=Math.min((n-la)/1000,.033);la=n;T+=dt;sh*=.87;if(mode=='play'&&G)upd(dt);
 for(const p of FX){p.t-=dt;if(p.s){p.y+=p.vy*dt}else if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt}}FX=FX.filter(p=>p.t>0);draw();requestAnimationFrame(loop)}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!window.Capacitor)navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('pointerdown',au);menu();requestAnimationFrame(loop);
</script></body></html>
